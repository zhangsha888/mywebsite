    <title>产品交易</title>
    <link rel="stylesheet" href="/static/index/css/trade-ui.css?v=20260916u"/>
    <style>
        .trade-ui-card.is-closed { opacity: .72; }
        .trade-closed-tag {
            display: inline-block;
            margin-left: 4px;
            padding: 0 4px;
            font-size: 10px;
            line-height: 14px;
            color: #8c8c8c;
            border: 1px solid #d9d9d9;
            border-radius: 2px;
            vertical-align: middle;
        }
        .trade-ui-price.price-flash, .trade-ui-price.down.price-flash { animation: tradeFlash .45s ease; }
        @keyframes tradeFlash { from { opacity: .35; } to { opacity: 1; } }
    </style>

    </section>
</div>
<div id="h5-tabbar"></div>
